name: StepFact and Trace unit regression
on:
  pull_request:
    paths:
      - 'bxcj_demo/**'
      - '.github/workflows/stepfact-regression.yml'
  push:
    branches: [main]
    paths:
      - 'bxcj_demo/**'
      - '.github/workflows/stepfact-regression.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r bxcj_demo/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q bxcj_demo
      - name: Unit regressions (no Gold or private PLC assets)
        run: python -m unittest discover -s bxcj_demo/tests -p 'test_*.py' -v
